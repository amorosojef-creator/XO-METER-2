name: Build XO Meter (Unsigned IPA)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Check billing calculations
        run: swiftc XOMeter/BillingEngine.swift XOMeter/BillParser.swift XOMeter/MeterTextExtractor.swift Tests/main.swift -o /tmp/xo-tests && /tmp/xo-tests
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Compile iOS app without code signing
        run: |
          xcodebuild -project XOMeter.xcodeproj -scheme XOMeter -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/XOMeter.app"
          test -d "$APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/XOMeter.app
          cd build
          zip -qr XOMeter-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: XO-Meter-unsigned-IPA
          path: build/XOMeter-unsigned.ipa
          if-no-files-found: error
